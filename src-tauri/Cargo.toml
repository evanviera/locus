[package]
name = "locus"
version = "0.1.1"
description = "Folders as reference boards"
authors = ["Locus"]
edition = "2021"

[lib]
name = "locus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "locus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "rayon"] }
psd = "0.3"
notify = "8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rfd = "0.15"
open = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
